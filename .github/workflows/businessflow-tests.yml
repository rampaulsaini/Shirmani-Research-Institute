name: BusinessFlow static safety tests
on:
  pull_request:
    paths:
      - "businessflow-lab.html"
      - "tests/businessflow.test.js"
      - ".github/workflows/businessflow-tests.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  businessflow-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --test tests/businessflow.test.js
